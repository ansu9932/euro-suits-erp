name: Frontend dependency audit

on:
  push:
    branches: [main]
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['package.json', 'package-lock.json', '.github/workflows/dependency-audit.yml']
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check lockfile including build dependencies
        run: npm audit --include=dev --audit-level=high
